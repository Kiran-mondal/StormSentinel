<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f131d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StormSentinel - Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { margin: 0; background-color: #0f131d; color: white; }
    </style>

    <!-- Telegram Web App Integration -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        function initTelegramBack() {
          if (!window.Telegram || !window.Telegram.WebApp) return;
          const tg = window.Telegram.WebApp;
          tg.ready();
          tg.BackButton.show();
          tg.BackButton.offClick();
          tg.BackButton.onClick(function() {
            window.location.replace("https://noval-network.vercel.app/");
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", initTelegramBack);
        } else {
          initTelegramBack();
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
