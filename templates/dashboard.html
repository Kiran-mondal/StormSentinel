<!DOCTYPE html>
<html>
<head>
  <title>⚡ StormSentinel - Live Storm Data</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background: #111; color: #0f0; font-family: Arial; text-align: center; padding: 20px; }
    canvas { background: #fff; border-radius: 8px; margin-top: 20px; }
    .metrics { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
    .card { background: #222; padding: 15px; border-radius: 8px; border: 1px solid #0f0; min-width: 150px; }
    .controls { margin-bottom: 20px; }
    input, button { padding: 10px; border-radius: 5px; border: none; margin: 5px; }
    button { background: #0f0; color: #111; cursor: pointer; font-weight: bold; }
    button:hover { background: #0c0; }
  </style>
</head>
<body>
  <h2>⚡ StormSentinel Dashboard</h2>
  
  <div class="controls">
      <input type="text" id="cityInput" placeholder="Enter city name...">
      <button onclick="setManualCity()">Search City</button>
      <button onclick="requestGPS()">📍 Use My GPS (Optional)</button>
  </div>

  <div class="metrics">
      <div class="card">📍 Location<br><strong id="location">--</strong></div>
      <div class="card">🕒 Local Time<br><strong id="localTime">--</strong> <span id="tzAbbr"></span></div>
      <div class="card">⚠️ Risk Level<br><strong id="risk">--</strong></div>
      <div class="card">🌩️ Storm Status<br><strong id="status">--</strong></div>
      <div class="card">🌡️ Temp | 💨 Wind<br><strong id="temp">--</strong>°C | <strong id="wind">--</strong> km/h</div>
  </div>

  <canvas id="freqChart" width="400" height="200"></canvas>

  <script>
    let currentCity = null;
    let currentLat = null;
    let currentLon = null;

    const ctx = document.getElementById('freqChart').getContext('2d');
    const freqChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Storm Intensity Metric',
          data: [],
          backgroundColor: 'rgba(0, 255, 0, 0.2)',
          borderColor: '#0f0',
          borderWidth: 2,
          tension: 0.3
        }]
      },
      options: {
        scales: {
          y: { beginAtZero: true, max: 150 },
          x: { ticks: { autoSkip: true, maxTicksLimit: 10 } }
        }
      }
    });

    function setManualCity() {
        currentCity = document.getElementById('cityInput').value;
        currentLat = null;
        currentLon = null;
        updateData();
    }

    function requestGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                currentLat = position.coords.latitude;
                currentLon = position.coords.longitude;
                currentCity = null;
                document.getElementById('cityInput').value = ""; 
                updateData();
            }, (error) => {
                alert("GPS permission denied or unavailable.");
            });
        } else {
            alert("Geolocation is not supported by your browser.");
        }
    }

    async function updateData() {
      try {
          let url = '/data';
          let params = new URLSearchParams();
          
          if (currentCity) params.append('city', currentCity);
          if (currentLat && currentLon) {
              params.append('lat', currentLat);
              params.append('lon', currentLon);
          }
          if (params.toString()) {
              url += '?' + params.toString();
          }

          const res = await fetch(url);
          const data = await res.json();

          if (data.error) {
              document.getElementById('location').textContent = "City Not Found";
              return;
          }

          // Convert Unix timestamps to the destination city's local time string for the chart
          freqChart.data.labels = data.labels.map(ts => {
              let date = new Date(ts * 1000);
              return date.toLocaleTimeString([], { timeZone: data.timezone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
          });
          
          freqChart.data.datasets[0].data = data.values;
          freqChart.update();

          // Update general UI cards
          document.getElementById('location').textContent = data.location;
          document.getElementById('risk').textContent = data.risk;
          document.getElementById('status').textContent = data.status;
          document.getElementById('temp').textContent = data.temp;
          document.getElementById('wind').textContent = data.wind;
          
          // Set current local time for the city
          let now = new Date();
          document.getElementById('localTime').textContent = now.toLocaleTimeString([], { timeZone: data.timezone, hour: '2-digit', minute: '2-digit' });
          document.getElementById('tzAbbr').textContent = "(" + data.timezone_abbr + ")";
          
      } catch (error) {
          console.error("Error fetching live data:", error);
      }
    }

    setInterval(updateData, 5000);
    updateData(); 
  </script>
</body>
</html>
